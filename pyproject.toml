[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deadline-assistant"
version = "0.1.0"
description = "Многопользовательский Telegram-помощник по учебным дедлайнам"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.20,<4",
  "telethon>=1.40,<2",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "aiosqlite>=0.21,<1",
  "asyncpg>=0.30,<1",
  "alembic>=1.15,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.8,<3",
  "apscheduler>=3.11,<4",
  "httpx>=0.28,<1",
  "openai>=2,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "cryptography>=45",
  "structlog>=25,<27",
  "qrcode>=8,<9",
  "tzdata>=2025.1",
  "tiktoken>=0.12,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[project.scripts]
deadline-assistant = "deadline_assistant.main:main"
deadline-bot = "deadline_bot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deadline_assistant", "src/deadline_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: реальные внешние API, только при явном включении",
  "postgres: изолированные тестовые БД PostgreSQL, только при POSTGRES_TEST_URL",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["deadline_assistant.integrations.telegram", "deadline_assistant.services.auth"]
disable_error_code = ["no-untyped-call", "no-any-return"]
