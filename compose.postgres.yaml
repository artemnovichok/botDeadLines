services:
  app:
    environment:
      DATABASE_URL: "postgresql+asyncpg://deadline:${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD}@postgres:5432/deadline"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: deadline
      POSTGRES_USER: deadline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deadline -d deadline"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
